<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipster Auto-Post 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .app-container {
            background: #1e293b; border-radius: 24px; padding: 28px;
            width: 100%; max-width: 820px; margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.7rem; font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle { color: #94a3b8; font-size: 0.88rem; margin-bottom: 22px; }

        label {
            display: block; font-size: 0.72rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: #94a3b8; margin-bottom: 6px;
        }
        input, textarea, select {
            width: 100%; padding: 10px 13px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 10px; color: #e2e8f0;
            font-size: 0.9rem; outline: none; transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8; }
        textarea { resize: vertical; min-height: 60px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* SECCIONES */
        .section {
            background: #0f172a; border: 1px solid #1e293b;
            border-radius: 16px; padding: 18px; margin-bottom: 18px;
        }
        .section-title {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 14px;
        }
        .section-title h2 { font-size: 0.95rem; font-weight: 700; }
        .section-title .tag {
            font-size: 0.7rem; padding: 3px 9px; border-radius: 6px;
            background: #1e293b; color: #94a3b8; border: 1px solid #334155;
        }

        /* TARJETAS DE PICK */
        .pick-card {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 14px; padding: 14px; margin-bottom: 12px;
            position: relative;
        }
        .pick-card-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
        }
        .pick-num {
            width: 26px; height: 26px; border-radius: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a; font-weight: 700; font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pick-card-header input { flex: 1; }
        .pick-card-header .del-btn {
            background: #450a0a; color: #fca5a5;
            border: 1px solid #7f1d1d; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; font-weight: 700;
            font-size: 1rem; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .pick-card-header .del-btn:hover { background: #7f1d1d; }

        .pick-card .field-label {
            font-size: 0.65rem; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 4px; display: block;
        }
        .pick-card textarea {
            min-height: 70px; font-size: 0.88rem;
            line-height: 1.5;
        }
        .pick-card .sub-pick-count {
            font-size: 0.7rem; color: #38bdf8;
            background: #0f172a; border: 1px solid #334155;
            padding: 2px 8px; border-radius: 6px;
            margin-left: auto; white-space: nowrap;
        }
        .pick-card .field-hint {
            font-size: 0.68rem; color: #64748b;
            margin-top: 4px; display: block;
        }
        .pick-card .odds-row {
            display: flex; align-items: flex-end; gap: 10px;
            margin-top: 10px;
        }
        .pick-card .odds-row .odds-field { flex: 0 0 130px; }

        .add-pick-btn {
            width: 100%; background: #1e293b;
            border: 1px dashed #334155; color: #94a3b8;
            padding: 12px; border-radius: 10px; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s; font-family: inherit;
        }
        .add-pick-btn:hover { border-color: #38bdf8; color: #38bdf8; }

        .totals-box {
            display: flex; justify-content: space-between; gap: 12px;
            margin-top: 14px; padding: 12px 16px;
            background: #020617; border-radius: 10px;
            border: 1px solid #334155;
        }
        .totals-box .item { text-align: center; flex: 1; }
        .totals-box .item .lbl {
            font-size: 0.65rem; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .totals-box .item .val {
            font-size: 1.15rem; font-weight: 700;
            color: #38bdf8; margin-top: 2px;
        }
        .totals-box .item .val.green { color: #4ade80; }

        /* SELECTOR TIPO DE APUESTA */
        .bet-type-selector {
            display: flex; gap: 8px; margin-top: 4px;
        }
        .bet-type-btn {
            flex: 1;
            padding: 11px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .bet-type-btn:hover {
            border-color: #475569;
            color: #cbd5e1;
        }
        .bet-type-btn.active {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            border-color: transparent;
            box-shadow: 0 4px 14px -4px rgba(56,189,248,0.5);
        }

        /* BOTONES */
        .btn-group { display: flex; gap: 12px; margin-top: 8px; }
        button.main-btn {
            flex: 1; padding: 14px 24px; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .btn-preview { background: #334155; color: #e2e8f0; }
        .btn-preview:hover { background: #475569; }
        .btn-send {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
        }
        .btn-send:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .preview-box {
            background: #0f172a; border: 1px dashed #475569;
            border-radius: 16px; padding: 20px; margin-top: 18px;
            white-space: pre-wrap; font-size: 0.92rem;
            line-height: 1.6; color: #cbd5e1; display: none;
        }
        .preview-box.visible { display: block; }

        .status {
            margin-top: 14px; padding: 12px 16px;
            border-radius: 12px; font-size: 0.88rem; display: none;
        }
        .status.success { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
        .status.error { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }
        .status.info { display: block; background: #172554; color: #93c5fd; border: 1px solid #1e40af; }

        details.config-section {
            background: #0f172a; border-radius: 14px; padding: 16px 18px;
            margin-bottom: 22px; border: 1px solid #1e293b;
        }
        details.config-section summary {
            cursor: pointer; font-weight: 600; color: #38bdf8;
            font-size: 0.88rem; list-style: none;
        }
        details.config-section summary::-webkit-details-marker { display: none; }
        details.config-section summary::before { content: '▸ '; }
        details.config-section[open] summary::before { content: '▾ '; }
        details.config-section[open] summary { margin-bottom: 14px; }
        .hint { font-size: 0.72rem; color: #64748b; margin-top: -8px; margin-bottom: 12px; }

        @media (max-width: 600px) {
            .app-container { padding: 18px; }
            .row { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .pick-card .odds-row { flex-direction: column; align-items: stretch; }
            .pick-card .odds-row .odds-field { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>⚡ Tipster Auto-Post</h1>
        <p class="subtitle">Añade tus selecciones, genera el texto tipster y publícalo en Telegram.</p>

        <!-- CONFIG -->
        <details class="config-section">
            <summary>⚙️ Configuración de Telegram</summary>
            <label for="botToken">Bot Token</label>
            <input type="password" id="botToken" placeholder="123456789:ABCdef..." />
            <p class="hint">Obtenlo de @BotFather.</p>
            <label for="chatId">Chat ID del grupo</label>
            <input type="text" id="chatId" placeholder="-1001234567890" />
            <p class="hint">ID del grupo (empieza con <code>-100</code>).</p>
            <label for="proxyUrl">Proxy CORS (opcional)</label>
            <input type="text" id="proxyUrl" placeholder="https://tu-worker.workers.dev" />
        </details>

        <!-- PICKS -->
        <div class="section">
            <div class="section-title">
                <h2>🎯 Selecciones</h2>
                <span class="tag" id="pickCount">0 picks</span>
            </div>
            <div id="picksList"></div>
            <button class="add-pick-btn" onclick="addPick()">+ Añadir selección</button>

            <div class="totals-box">
                <div class="item">
                    <div class="lbl">Nº picks</div>
                    <div class="val" id="totPicks">0</div>
                </div>
                <div class="item">
                    <div class="lbl">Cuota total</div>
                    <div class="val" id="totOdds">1.00</div>
                </div>
                <div class="item">
                    <div class="lbl">Ganancia pot.</div>
                    <div class="val green" id="totWin">+0.00</div>
                </div>
            </div>
        </div>

        <!-- DATOS EXTRA -->
        <div class="section">
            <div class="section-title"><h2>📝 Datos de la publicación</h2></div>
            <div class="row">
                <div>
                    <label for="sport">Deporte / Liga</label>
                    <input type="text" id="sport" placeholder="Ej: Tenis — ATP 500" />
                </div>
                <div>
                    <label for="stake">Stake</label>
                    <input type="text" id="stake" value="1" />
                </div>
            </div>

            <label>Tipo de apuesta</label>
            <div class="bet-type-selector">
                <button type="button" class="bet-type-btn" data-type="parlay" onclick="setBetType('parlay')">Parlay</button>
                <button type="button" class="bet-type-btn" data-type="directa" onclick="setBetType('directa')">Derecha</button>
                <button type="button" class="bet-type-btn active" data-type="auto" onclick="setBetType('auto')">Escoger</button>
            </div>

            <label for="confidence" style="margin-top:14px;">Confianza</label>
            <select id="confidence">
                <option value="alta">🔥 Alta</option>
                <option value="media" selected>💪 Media</option>
                <option value="baja">🤔 Baja</option>
            </select>

            <label for="extra" style="margin-top:14px;">Notas / análisis (opcional)</label>
            <textarea id="extra" placeholder="Ej: Estos jugadores llegan en gran forma..."></textarea>
        </div>

        <div class="btn-group">
            <button class="main-btn btn-preview" onclick="generarPreview()">👁️ Previsualizar</button>
            <button class="main-btn btn-send" id="sendBtn" onclick="enviarTelegram()">🚀 Enviar a Telegram</button>
        </div>

        <div class="preview-box" id="previewBox"></div>
        <div class="status" id="statusMsg"></div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // ESTADO
        // ═══════════════════════════════════════════════════════════════
        let picks = [];
        let betType = 'auto'; // 'parlay' | 'directa' | 'auto'

        // ═══════════════════════════════════════════════════════════════
        // UTILIDADES
        // ═══════════════════════════════════════════════════════════════
        const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const num = v => { const n = parseFloat(String(v||'').replace(',','.')); return isNaN(n)?0:n; };
        const attr = s => String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

        // ═══════════════════════════════════════════════════════════════
        // SELECTOR DE TIPO DE APUESTA
        // ═══════════════════════════════════════════════════════════════
        function setBetType(type) {
            betType = type;
            document.querySelectorAll('.bet-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            actualizarTotales();
        }

        // ═══════════════════════════════════════════════════════════════
        // RENDER PICKS (tarjetas)
        // ═══════════════════════════════════════════════════════════════
        function renderPicks() {
            const cont = document.getElementById('picksList');
            cont.innerHTML = '';
            if (picks.length === 0) picks.push({ event: '', selection: '', odds: '' });

            picks.forEach((p, i) => {
                const subCount = (p.selection.match(/•/g) || []).length;
                const card = document.createElement('div');
                card.className = 'pick-card';
                card.innerHTML = `
                    <div class="pick-card-header">
                        <div class="pick-num">${i+1}</div>
                        <input type="text" placeholder="Evento (Equipo A - Equipo B)"
                               value="${attr(p.event)}" oninput="updatePick(${i},'event',this.value)" />
                        ${subCount > 1 ? `<span class="sub-pick-count">${subCount} legs</span>` : ''}
                        <button class="del-btn" onclick="removePick(${i})">×</button>
                    </div>
                    <span class="field-label">Selección</span>
                    <textarea placeholder="Ejemplo constructor:&#10;• Jenson Brooksby ganar al menos 1 set&#10;• Más de 19.5 juegos&#10;&#10;Ejemplo simple:&#10;Ambos equipos marcan"
                              oninput="updatePick(${i},'selection',this.value)">${esc(p.selection)}</textarea>
                    <span class="field-hint">💡 Usa <b>•</b> al inicio de cada línea para varios legs (Constructor/Bet Builder)</span>

                    <div class="odds-row">
                        <div class="odds-field">
                            <span class="field-label">Cuota</span>
                            <input type="number" step="0.01" min="1" placeholder="1.85"
                                   value="${attr(p.odds)}" oninput="updatePick(${i},'odds',this.value)" />
                        </div>
                    </div>
                `;
                cont.appendChild(card);
            });
            actualizarTotales();
        }

        function updatePick(i, field, value) {
            if (!picks[i]) return;
            picks[i][field] = value;
            actualizarTotales();
            if (field === 'selection') {
                const card = document.querySelectorAll('.pick-card')[i];
                if (card) {
                    const header = card.querySelector('.pick-card-header');
                    const existing = header.querySelector('.sub-pick-count');
                    const subCount = (value.match(/•/g) || []).length;
                    if (subCount > 1) {
                        if (existing) existing.textContent = `${subCount} legs`;
                        else {
                            const span = document.createElement('span');
                            span.className = 'sub-pick-count';
                            span.textContent = `${subCount} legs`;
                            header.insertBefore(span, header.querySelector('.del-btn'));
                        }
                    } else if (existing) existing.remove();
                }
            }
        }

        function removePick(i) {
            picks.splice(i, 1);
            if (picks.length === 0) picks.push({ event:'', selection:'', odds:'' });
            renderPicks();
        }

        function addPick() {
            const last = picks[picks.length-1];
            if (last && !last.event && !last.selection && !last.odds) {
                const cards = document.querySelectorAll('.pick-card');
                const inputs = cards[cards.length-1].querySelectorAll('input');
                if (inputs[0]) inputs[0].focus();
                return;
            }
            picks.push({ event:'', selection:'', odds:'' });
            renderPicks();
            const cards = document.querySelectorAll('.pick-card');
            const inputs = cards[cards.length-1].querySelectorAll('input');
            if (inputs[0]) inputs[0].focus();
        }

        function actualizarTotales() {
            const validos = picks.filter(p => p.event && p.selection && num(p.odds) > 1);
            const totalOdds = validos.reduce((acc, p) => acc * num(p.odds), 1);
            const stake = num(document.getElementById('stake').value) || 1;
            const ganancia = totalOdds * stake;

            document.getElementById('totPicks').textContent = validos.length;
            document.getElementById('totOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('totWin').textContent = '+' + ganancia.toFixed(2);
            document.getElementById('pickCount').textContent = `${validos.length} pick${validos.length!==1?'s':''}`;
        }
        document.getElementById('stake').addEventListener('input', actualizarTotales);

        // ═══════════════════════════════════════════════════════════════
        // GENERADOR DE TEXTO TIPSTER
        // ═══════════════════════════════════════════════════════════════
        function generarTexto() {
            const validos = picks.filter(p => p.event && p.selection && num(p.odds) > 1);
            if (validos.length === 0) return null;

            const sport = document.getElementById('sport').value.trim();
            const stake = document.getElementById('stake').value.trim() || '1';
            const confidence = document.getElementById('confidence').value;
            const extra = document.getElementById('extra').value.trim();
            const totalOdds = validos.reduce((acc, p) => acc * num(p.odds), 1);

            // Determinar tipo efectivo
            let tipoEfectivo = betType;
            if (betType === 'auto') {
                tipoEfectivo = validos.length > 1 ? 'parlay' : 'directa';
            }
            // Si es "directa" pero hay varios picks → solo usamos el primero
            const picksUsados = tipoEfectivo === 'directa' ? validos.slice(0, 1) : validos;
            const esParlay = tipoEfectivo === 'parlay' && picksUsados.length > 1;

            const frases = {
                alta: ['🔥 <b>¡JUGADA DE ALTA CONFIANZA!</b> 🔥',
                       '💎 <b>PICK PREMIUM — ALTA CONVICCIÓN</b> 💎',
                       '🚨 <b>ALERTA DE VALOR — CONFIANZA MÁXIMA</b> 🚨'],
                media: ['💪 <b>Jugada sólida del día</b>',
                        '✅ <b>Pick con buen valor</b>',
                        '📊 <b>Oportunidad interesante</b>'],
                baja: ['🤔 <b>Jugada especulativa</b>',
                       '⚠️ <b>Pick de riesgo controlado</b>',
                       '🎲 <b>Apuesta de valor marginal</b>'],
            };
            const frase = frases[confidence][Math.floor(Math.random()*frases[confidence].length)];

            const s = (sport + ' ' + picksUsados.map(p=>p.event).join(' ')).toLowerCase();
            let sportEmoji = '🏆';
            if (/fútbol|futbol|soccer|gol|goleador/.test(s)) sportEmoji = '⚽';
            else if (/tenis|atp|wta|juego|set/.test(s)) sportEmoji = '🎾';
            else if (/baloncesto|nba|basket|punto/.test(s)) sportEmoji = '🏀';
            else if (/béisbol|beisbol|mlb/.test(s)) sportEmoji = '⚾';
            else if (/f1|fórmula|formula/.test(s)) sportEmoji = '🏎️';
            else if (/ufc|mma/.test(s)) sportEmoji = '🥊';

            const nums = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
            let msg = '';

            msg += `${frase}\n\n`;

            if (esParlay) {
                msg += `🎰 <b>PARLAY DE ${picksUsados.length} EVENTOS</b>\n`;
                if (sport) msg += `🏟️ ${esc(sport)}\n`;
                msg += `\n`;

                picksUsados.forEach((p, i) => {
                    const bullet = nums[i] || '•';
                    msg += `${bullet} <b>${esc(p.event)}</b>\n`;

                    const subLines = p.selection.split('\n')
                        .map(l => l.replace(/^[•·\-\s]+/, '').trim())
                        .filter(l => l);

                    if (subLines.length > 1) {
                        msg += `   🎯 <i>Constructor @ ${esc(p.odds)}</i>\n`;
                        subLines.forEach(sl => { msg += `   ✓ ${esc(sl)}\n`; });
                    } else {
                        const sel = subLines[0] || p.selection;
                        msg += `   🎯 <b>${esc(sel)}</b>  ·  💰 ${esc(p.odds)}\n`;
                    }
                    msg += `\n`;
                });

                msg += `💥 <b>Cuota total:</b> ${totalOdds.toFixed(2)}\n`;
            } else {
                const p = picksUsados[0];
                msg += `${sportEmoji} <b>${esc(p.event)}</b>\n`;
                if (sport) msg += `🏟️ ${esc(sport)}\n`;
                msg += `\n`;

                const subLines = p.selection.split('\n')
                    .map(l => l.replace(/^[•·\-\s]+/, '').trim())
                    .filter(l => l);

                if (subLines.length > 1) {
                    msg += `🎯 <b>Constructor @ ${esc(p.odds)}:</b>\n`;
                    subLines.forEach(sl => { msg += `   ✓ ${esc(sl)}\n`; });
                } else {
                    const sel = subLines[0] || p.selection;
                    msg += `🎯 <b>Selección:</b> <b>${esc(sel)}</b>\n`;
                    msg += `💰 <b>Cuota:</b> ${esc(p.odds)}\n`;
                }
            }

            msg += `📈 <b>Stake:</b> ${esc(stake)} unidad${num(stake)!==1?'es':''}\n`;

            if (extra) msg += `\n📝 <b>Análisis:</b>\n${esc(extra)}\n`;

            msg += `\n━━━━━━━━━━━━━━━━━━\n`;
            msg += `🍀 <i>¡Mucha suerte, familia!</i> 🍀\n`;
            msg += `#Apuestas #Tipster #PickDelDía`;

            return msg;
        }

        // ═══════════════════════════════════════════════════════════════
        // PREVIEW
        // ═══════════════════════════════════════════════════════════════
        function generarPreview() {
            const texto = generarTexto();
            const box = document.getElementById('previewBox');
            box.classList.add('visible');
            if (!texto) {
                box.textContent = '⚠️ Añade al menos una selección con evento, selección y cuota.';
                return;
            }
            box.textContent = texto.replace(/<\/?[^>]+(>|$)/g, '');
        }

        // ═══════════════════════════════════════════════════════════════
        // ENVÍO A TELEGRAM
        // ═══════════════════════════════════════════════════════════════
        async function enviarTelegram() {
            const btn = document.getElementById('sendBtn');
            const token = document.getElementById('botToken').value.trim();
            const chatId = document.getElementById('chatId').value.trim();
            const proxy = document.getElementById('proxyUrl').value.trim();

            if (!token || !chatId) {
                mostrarEstado('error', '❌ Configura Bot Token y Chat ID.');
                return;
            }
            const texto = generarTexto();
            if (!texto) {
                mostrarEstado('error', '❌ Añade al menos una selección válida.');
                return;
            }

            btn.disabled = true; btn.textContent = '⏳ Enviando…';
            ocultarEstado();

            try {
                const telegramUrl = `https://api.telegram.org/bot${token}/sendMessage`;
                const fetchUrl = proxy ? `${proxy}?url=${encodeURIComponent(telegramUrl)}` : telegramUrl;
                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId, text: texto,
                        parse_mode: 'HTML', disable_web_page_preview: true,
                    }),
                });
                const data = await response.json();
                if (data.ok) mostrarEstado('success', '✅ ¡Mensaje enviado al grupo! 🎉');
                else mostrarEstado('error', `❌ Error de Telegram: ${data.description || 'Desconocido'}`);
            } catch (err) {
                if (/Failed to fetch|NetworkError/.test(err.message))
                    mostrarEstado('error', '❌ Error CORS. Configura un proxy.');
                else
                    mostrarEstado('error', `❌ Error: ${err.message}`);
            } finally {
                btn.disabled = false; btn.textContent = '🚀 Enviar a Telegram';
            }
        }

        function mostrarEstado(tipo, mensaje) {
            const status = document.getElementById('statusMsg');
            status.className = `status ${tipo}`;
            status.textContent = mensaje;
            status.style.display = 'block';
        }
        function ocultarEstado() {
            const status = document.getElementById('statusMsg');
            status.className = 'status'; status.style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════
        window.addEventListener('DOMContentLoaded', renderPicks);
    </script>
</body>
</html>
